name: Lightweight CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Validate Compose
        run: |
          cp deploy/env.example deploy/.env
          cp deploy/adapter.env.example deploy/adapter.env
          cp deploy/cloudflared.env.example deploy/cloudflared.env
          docker compose \
            --project-directory deploy \
            --env-file deploy/.env \
            --file deploy/docker-compose.yml \
            config --quiet
          SMARTCORE_IMAGE_TAG=test docker compose \
            --project-directory deploy \
            --file deploy/docker-compose.dev.yml \
            config --quiet
