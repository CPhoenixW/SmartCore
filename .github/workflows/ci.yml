name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Python syntax
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check app tests --output-format=json | tee ruff-report.json
      - name: Upload Ruff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json
      - name: Pytest
        run: pytest -q
      - name: JavaScript syntax
        run: |
          find app/web/static app/screen/static -name '*.js' -print0 | xargs -0 -n1 node --check
