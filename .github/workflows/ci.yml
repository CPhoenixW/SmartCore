name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: pip install -r requirements-dev.lock

      - name: Lint with ruff
        run: ruff check app/server tests

      - name: Run tests
        env:
          DATABASE_URL: sqlite:////tmp/smartcore-test.sqlite
          AUTH_SECRET_FILE: /tmp/smartcore-test-auth-secret
          SCHEDULER_ENABLED: "false"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check Python syntax
        run: python -m compileall -q app tests

      - name: Validate Compose
        run: |
          cp deploy/env.example deploy/.env
          cp deploy/adapter.env.example deploy/adapter.env
          cp deploy/cloudflared.env.example deploy/cloudflared.env
          docker compose \
            --project-directory deploy \
            --env-file deploy/.env \
            --file deploy/docker-compose.yml \
            config --quiet
          SMARTCORE_IMAGE_TAG=test docker compose \
            --project-directory deploy \
            --file deploy/docker-compose.dev.yml \
            config --quiet
