name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "app/main.py"
      - "app/web/legacy_routes.py"
      - "deploy/Dockerfile"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "app/main.py"
      - "app/web/legacy_routes.py"
      - "deploy/Dockerfile"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run type-check 2>&1 | tee typecheck-report.txt
      - name: Upload type-check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: frontend/typecheck-report.txt
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
