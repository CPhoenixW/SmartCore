# SmartCore production stack: FastAPI app + Caddy (public HTTPS) + tunnel boundary.
# Copy env.example to .env in this directory before starting.
#
# Public HTTPS:  caddy :443 -> /feishu/event only
# Cloudflare Tunnel: tunnel-boundary on host docker bridge (default 172.17.0.1:8000) -> /feishu/event only
# Internal: app on APP_BIND (default 127.0.0.1:8000); production set APP_BIND to server Tailscale IPv4

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    volumes:
      - smartcore-data:/app/data
      - smartcore-backups:/app/backups
    expose:
      - "8000"
    ports:
      # Bind localhost by default; override APP_BIND for Tailscale/private host access.
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    networks:
      - smartcore

  tunnel-boundary:
    image: caddy:2-alpine
    ports:
      # Bind docker bridge gateway by default; override TUNNEL_BOUNDARY_BIND if bridge IP differs.
      - "${TUNNEL_BOUNDARY_BIND:-172.17.0.1}:8000:80"
    volumes:
      - ./Caddyfile.tunnel-boundary:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - smartcore

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      CADDY_ADMIN_EMAIL: ${CADDY_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - smartcore

networks:
  smartcore:
    driver: bridge

volumes:
  smartcore-data:
  smartcore-backups:
  caddy-data:
  caddy-config:
