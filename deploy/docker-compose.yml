# SmartCore production stack: FastAPI app + Caddy (public HTTPS) + tunnel boundary.
# Copy env.example to .env in this directory before starting.
#
# Public HTTPS/Tunnel: opt-in PWA/device allowlist.
# Internal: app on APP_BIND (default 127.0.0.1:8000); production set APP_BIND to server Tailscale IPv4

services:
  app:
    image: "smartcore:${SMARTCORE_IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      PUBLIC_ACCESS_ENABLED: ${PUBLIC_ACCESS_ENABLED:-false}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-false}
      AUTH_SETUP_ENABLED: ${AUTH_SETUP_ENABLED:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    volumes:
      - smartcore-data:/app/data
      - smartcore-backups:/app/backups
      - smartcore-idea-media:/app/data/idea_media
    expose:
      - "8000"
    ports:
      # Bind localhost by default; override APP_BIND for Tailscale/private host access.
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - smartcore

  tunnel-boundary:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      PUBLIC_ACCESS_ENABLED: ${PUBLIC_ACCESS_ENABLED:-false}
      TUNNEL_PROXY_NETWORK: ${TUNNEL_PROXY_NETWORK:-127.0.0.1/32}
    ports:
      # Bind docker bridge gateway by default; override TUNNEL_BOUNDARY_BIND if bridge IP differs.
      - "${TUNNEL_BOUNDARY_BIND:-172.17.0.1}:8000:80"
    volumes:
      - ./Caddyfile.tunnel-boundary:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.public-routes:/etc/caddy/Caddyfile.public-routes:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - smartcore

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      CADDY_ADMIN_EMAIL: ${CADDY_ADMIN_EMAIL:-admin@example.com}
      PUBLIC_ACCESS_ENABLED: ${PUBLIC_ACCESS_ENABLED:-false}
      TUNNEL_PROXY_NETWORK: ${TUNNEL_PROXY_NETWORK:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.public-routes:/etc/caddy/Caddyfile.public-routes:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - smartcore

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
    env_file:
      - cloudflared.env
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      - tunnel-boundary

  dsh-runtime:
    image: "smartcore-dsh-runtime:${SMARTCORE_IMAGE_TAG:-latest}"
    build:
      context: ..
      dockerfile: deploy/dsh.Dockerfile
    user: "0:0"
    privileged: true
    pid: host
    env_file:
      - dsh.env
    environment:
      DSH_HOST_ROOT: /host
    volumes:
      - /:/host
      - smartcore-dsh-home:/data/dsh-home
      - smartcore-dsh-scopes:/data/scopes
    networks:
      - smartcore
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18790/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  smartcore:
    driver: bridge

volumes:
  smartcore-data:
  smartcore-backups:
  caddy-data:
  caddy-config:
  smartcore-adapter-logs:
  smartcore-dsh-home:
  smartcore-dsh-scopes:
  smartcore-idea-media:
