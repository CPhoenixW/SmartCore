[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcore"
version = "0.1.0"
description = "Personal student secretary system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "apscheduler",
    "httpx",
    "openai>=1.0",
    "python-multipart",
    "cryptography",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.server*"]

[tool.setuptools.package-data]
"app.server" = [
    "db/sql/*.sql",
    "db/sql/migrations/*.sql",
    "web/dist/*",
    "web/dist/assets/*",
    "screen/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers"]
markers = [
    "unit: isolated domain and pure-function tests",
    "api: FastAPI request and ownership tests",
    "contract: external and compatibility contract tests",
    "migration: SQLite schema and data-preservation tests",
    "smoke: application assembly and health tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/server/agent/routes.py" = ["E501", "UP035"]
